<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Mi BFF AI</title>
<meta name="theme-color" content="#1a0f24">
<meta name="description" content="Tu BFF virtual en su cuarto: platica, investiga y cámbiale el look.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/icon-192.png">
<link rel="preload" as="image" href="img2/cuarto.webp">
<link rel="preload" as="image" href="img2/stand-base.webp">
<link rel="stylesheet" href="css/app.css">
<script type="importmap">{"imports":{"onnxruntime-web":"https://cdn.jsdelivr.net/npm/onnxruntime-web@1.18.0/dist/esm/ort.min.js"}}</script>
</head>
<body class="text-mode">
<div id="loader"><img src="img/silueta.png" alt=""><div class="lname">Mi BFF AI</div><div class="ltag">Vale te está esperando en su cuarto…</div><div class="lbar"><i></i></div></div>
<main id="app">
  <canvas id="gl" role="img" aria-label="Vale en su cuarto"></canvas>
  <canvas id="fx" aria-hidden="true"></canvas>
  <div id="ambience" aria-hidden="true"></div>
  <div id="vig" aria-hidden="true"></div>
  <div id="hints"></div>
  <div id="bubble" class="hide"></div>
  <button id="gear" aria-label="Ajustes">⚙</button>
  <section id="chat">
    <header><img src="img/avatar.webp" alt=""><div><b id="cname">Vale</b><small id="cstatus">en línea</small></div></header>
    <div id="msgs" aria-live="polite"></div>
  </section>
  <form id="bar" autocomplete="off">
    <button type="button" id="mic" aria-label="Micrófono">🎤</button>
    <textarea id="txt" rows="1" placeholder="Escríbele…" enterkeyhint="send"></textarea>
    <button id="send" aria-label="Enviar">➤</button>
  </form>
</main>

<div id="sheet" class="hide" role="dialog" aria-label="Panel">
  <div class="sh-in">
    <div class="sh-head"><b id="shTitle"></b><button class="x" data-close>✕</button></div>
    <div id="shBody"></div>
  </div>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
